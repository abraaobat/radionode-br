name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical repository files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            VERSION
            CHANGELOG.md
            CONTRIBUTING.md
            SECURITY.md
            docs/architecture.md
            docs/roadmap.md
            docs/decisions/ADR-0001-system-boundaries.md
          )

          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Validate version format
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\n\r' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "VERSION is not valid SemVer: $version"
            exit 1
          }

  afsk-upstream-native:
    runs-on: ubuntu-latest
    steps:
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Checkout pinned esp32-afsk candidate
        run: |
          git clone https://github.com/dkaukov/esp32-afsk.git esp32-afsk
          cd esp32-afsk
          git checkout e771c98d08fa5e98d5481e5d8e48601631891d57

      - name: Run upstream native AFSK tests
        working-directory: esp32-afsk
        run: pio test -e native

  afsk-esp32-s3-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RadioNode BR
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile pinned AFSK candidate for ESP32-S3
        working-directory: validation/esp32-afsk-s3-smoke
        run: pio run -e esp32-s3-devkitc-1

  ptt-safety-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RadioNode BR
        uses: actions/checkout@v4

      - name: Compile PTT fail-safe tests
        working-directory: validation/ptt-safety-native
        run: >-
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic
          test_ptt_safety.cpp -o test_ptt_safety

      - name: Run PTT fail-safe tests
        working-directory: validation/ptt-safety-native
        run: ./test_ptt_safety
